<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#181230" />
      <stop offset="60%" stop-color="#0F0C1E" />
      <stop offset="100%" stop-color="#080611" />
    </radialGradient>

    <!-- Central Outer Glow -->
    <radialGradient id="outerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6D28D9" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>

    <!-- Central Disc Gradient -->
    <radialGradient id="centerDisc" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#9D5CFA" />
      <stop offset="40%" stop-color="#7C3AED" />
      <stop offset="75%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#37136B" />
    </radialGradient>

    <!-- Bead Sphere Gradient -->
    <radialGradient id="beadGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#F3EEFF" />
      <stop offset="25%" stop-color="#DDD6FE" />
      <stop offset="55%" stop-color="#A78BFA" />
      <stop offset="85%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#3B0764" />
    </radialGradient>

    <!-- Leader Bead (Top) Gradient -->
    <radialGradient id="leaderBeadGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#E9D5FF" />
      <stop offset="60%" stop-color="#B794F6" />
      <stop offset="85%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B0764" />
    </radialGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E9D5FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Rim Shadow/Glow -->
    <linearGradient id="moonFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181329" />
      <stop offset="100%" stop-color="#0D0A18" />
    </linearGradient>
  </defs>

